[workspace]
members = [".", "ruminac", "rmvm"]
resolver = "2"

[package]
name = "rumina"
version = "1.2.3"
edition = "2024"
description = "Lamina language compatible interpreter written in rust"
license = "MPL-2.0"
default-run = "rumina-cli"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rumina-cli"
path = "src/main.rs"

[[bin]]
name = "ruminac"
path = "ruminac/src/main.rs"

[[bin]]
name = "rmvm"
path = "rmvm/src/main.rs"

[dependencies]
num = "^0.4"
rand = "^0.9"
chrono = "^0.4"
lazy_static = "^1.4"
mathcore = "^0.3.1"
rustc-hash = "^2.0"
rayon = "^1.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.cranelift]
version = "^0.128"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.cranelift-jit]
version = "^0.128"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.cranelift-module]
version = "^0.128"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.cranelift-native]
version = "^0.128"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = "^3"

[features]
default = []
jit = ["cranelift", "cranelift-jit", "cranelift-module", "cranelift-native"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "^0.2"
getrandom = { version = "^0.3", features = ["wasm_js"] }

[dev-dependencies]
criterion = "^0.8"
